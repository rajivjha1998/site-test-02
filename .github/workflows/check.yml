# Validates and builds every push to draft or main (e.g. hand edits or AI changes), so a
# broken site.json is caught early (the Deploy site workflow validates again before publishing).
name: Check site

on:
  push:
    branches: [draft, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm build
